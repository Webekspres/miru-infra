# Production — diaktifkan scripts/sync-edge.sh (disalin ke conf.d/20-production.conf)
# hanya bila sertifikat mirubanksampah.id sudah ada.
#
#   mirubanksampah.id      web (Next.js); /api/ & /objects/ → Django di host yang
#                          sama, jadi cookie login host-only (tidak bocor ke dev.*)
#   www.mirubanksampah.id  → redirect ke mirubanksampah.id
#   api.mirubanksampah.id  API untuk aplikasi mobile (Bearer token)
#
# HSTS tanpa includeSubDomains: subdomain lain (mail/webmail di hosting
# terpisah) tidak boleh ikut dipaksa HTTPS dari sini. HSTS bawaan Django
# (includeSubDomains; preload) disembunyikan dan diganti versi ini.

server {
    listen 443 ssl;
    server_name mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/current/production/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/current/production/privkey.pem;
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        set $upstream_api prod-api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /objects/ {
        set $upstream_api prod-api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        set $upstream_admin prod-admin:3000;
        proxy_pass http://$upstream_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name www.mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/current/production/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/current/production/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://mirubanksampah.id$request_uri;
}

server {
    listen 443 ssl;
    server_name api.mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/current/production/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/current/production/privkey.pem;
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /objects/ {
        set $upstream_api prod-api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        set $upstream_api prod-api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
