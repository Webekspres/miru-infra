resolver 127.0.0.11 valid=10s ipv6=off;

# Batasi ke TLS 1.2/1.3 (nonaktifkan TLS 1.0/1.1 yang rentan) dan cipher
# suite modern — pertahanan terhadap downgrade/MITM di jalur TLS.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Catch-all / bare IP / server.* — no web app
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name server.mirubanksampah.id _;
    ssl_certificate     /etc/nginx/certs/live/dev.mirubanksampah.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/dev.mirubanksampah.id/privkey.pem;
    return 444;
}

# Admin staging
server {
    listen 80;
    server_name dev.mirubanksampah.id;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name dev.mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/live/dev.mirubanksampah.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/dev.mirubanksampah.id/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 20M;

    location / {
        set $upstream_admin admin:3000;
        proxy_pass http://$upstream_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# API staging
server {
    listen 80;
    server_name api.dev.mirubanksampah.id;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.dev.mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/live/dev.mirubanksampah.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/dev.mirubanksampah.id/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 20M;

    # /objects/ dilayani Django (PublicObjectView → MinIO). Jangan proxy langsung ke
    # MinIO dengan variabel upstream — nginx tidak me-rewrite URI sehingga bucket ter-list kosong.
    location /objects/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
