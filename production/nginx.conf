# Salin ke /opt/miru-prod/nginx.conf saat domain production siap.
# Placeholder — sesuaikan server_name dan path sertifikat.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name api.mirubanksampah.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/live/api.mirubanksampah.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.mirubanksampah.id/privkey.pem;

    client_max_body_size 20M;

    location /objects/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
