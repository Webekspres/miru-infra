# Pengaturan bersama edge proxy (staging + production).

# DNS internal Docker; upstream memakai variabel supaya nginx tetap jalan
# walau salah satu stack sedang mati.
resolver 127.0.0.11 valid=10s ipv6=off;

# TLS 1.2/1.3 + cipher modern (tanpa TLS 1.0/1.1).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

client_max_body_size 20M;

# Port 80 untuk semua host: tantangan Let's Encrypt (webroot), sisanya → HTTPS.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Host tak dikenal / IP langsung / server.* — tutup koneksi.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/current/staging/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/current/staging/privkey.pem;
    return 444;
}
