name: Deploy MIRU Infra

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'staging/**'
      - 'production/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy paths
        id: paths
        run: |
          if [ "$DEPLOY_ENV" = "production" ]; then
            echo "target_dir=/opt/miru-prod" >> "$GITHUB_OUTPUT"
            echo "source_dir=production" >> "$GITHUB_OUTPUT"
          else
            echo "target_dir=/opt/miru-staging" >> "$GITHUB_OUTPUT"
            echo "source_dir=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync stack files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22022 }}
          username: ${{ secrets.SSH_USER || 'developer' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ${{ steps.paths.outputs.source_dir }}/docker-compose.yml,${{ steps.paths.outputs.source_dir }}/nginx.conf
          target: ${{ steps.paths.outputs.target_dir }}
          strip_components: 1

      - name: Apply stack on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22022 }}
          username: ${{ secrets.SSH_USER || 'developer' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET="${{ steps.paths.outputs.target_dir }}"
            cd "$TARGET"

            echo "==> GHCR login (pull app images if needed)..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

            if [ "${{ env.DEPLOY_ENV }}" = "staging" ]; then
              echo "==> Ensuring MinIO credentials in .env..."
              touch .env
              grep -q '^MINIO_ROOT_USER=' .env || echo 'MINIO_ROOT_USER=miru_staging' >> .env
              grep -q '^MINIO_ROOT_PASSWORD=' .env || echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)" >> .env
              grep -q '^MINIO_ACCESS_KEY=' .env || echo 'MINIO_ACCESS_KEY=miru_staging' >> .env
              grep -q '^MINIO_SECRET_KEY=' .env || echo "MINIO_SECRET_KEY=$(grep '^MINIO_ROOT_PASSWORD=' .env | cut -d= -f2-)" >> .env
              grep -q '^MINIO_BUCKET=' .env || echo 'MINIO_BUCKET=mirubanksampah' >> .env
              grep -q '^MINIO_REGION=' .env || echo 'MINIO_REGION=us-east-1' >> .env
            fi

            echo "==> Starting stack at $TARGET ..."
            docker compose pull api 2>/dev/null || true
            docker compose up -d

            echo "==> Waiting for MinIO..."
            for i in $(seq 1 30); do
              if docker compose ps minio 2>/dev/null | grep -q '(healthy)'; then
                echo "MinIO is healthy."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: MinIO not healthy"
                docker compose ps
                docker compose logs minio --tail 30
                exit 1
              fi
              sleep 2
            done

            echo "==> Verifying MinIO from Django..."
            docker compose exec -T api python manage.py shell -c "
            from django.conf import settings
            from api.services.object_storage import ensure_bucket
            assert settings.MINIO_ENABLED, 'MINIO_ENABLED is False'
            ensure_bucket()
            print('MinIO OK:', settings.MINIO_ENDPOINT, settings.MINIO_BUCKET)
            "

            docker compose ps
            echo "==> Infra deploy completed."
