# Salin ke /opt/miru-prod/nginx.conf saat domain production siap.
# Placeholder — sesuaikan server_name dan path sertifikat.

resolver 127.0.0.11 valid=10s ipv6=off;

# Batasi ke TLS 1.2/1.3 (nonaktifkan TLS 1.0/1.1 yang rentan) dan cipher
# suite modern — pertahanan terhadap downgrade/MITM di jalur TLS.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    server_name api.mirubanksampah.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/live/api.mirubanksampah.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.mirubanksampah.id/privkey.pem;

    # HSTS di level nginx (bukan cuma dari Django) supaya berlaku untuk semua
    # response, termasuk location yang menimpa add_header-nya sendiri.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 20M;

    location /objects/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
