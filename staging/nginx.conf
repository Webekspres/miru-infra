resolver 127.0.0.11 valid=10s ipv6=off;

# Catch-all / bare IP / server.* — no web app
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name server.mirubanksampah.id _;
    ssl_certificate     /etc/nginx/certs/live/dev.mirubanksampah.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/dev.mirubanksampah.id/privkey.pem;
    return 444;
}

# Admin staging
server {
    listen 80;
    server_name dev.mirubanksampah.id;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name dev.mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/live/dev.mirubanksampah.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/dev.mirubanksampah.id/privkey.pem;

    client_max_body_size 20M;

    location / {
        set $upstream_admin admin:3000;
        proxy_pass http://$upstream_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# API staging
server {
    listen 80;
    server_name api.dev.mirubanksampah.id;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.dev.mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/live/dev.mirubanksampah.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/dev.mirubanksampah.id/privkey.pem;

    client_max_body_size 20M;

    location /objects/ {
        set $upstream_minio minio:9000;
        proxy_pass http://$upstream_minio/mirubanksampah/;
        proxy_set_header Host minio:9000;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
