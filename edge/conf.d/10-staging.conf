# Staging — dev.mirubanksampah.id (web) & api.dev.mirubanksampah.id (API).
# Upstream: alias jaringan miru-edge dari /opt/miru-staging.

server {
    listen 443 ssl;
    server_name dev.mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/current/staging/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/current/staging/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        set $upstream_admin staging-admin:3000;
        proxy_pass http://$upstream_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name api.dev.mirubanksampah.id;
    ssl_certificate     /etc/nginx/certs/current/staging/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/current/staging/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # /objects/ dilayani Django (PublicObjectView → MinIO).
    location /objects/ {
        set $upstream_api staging-api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        set $upstream_api staging-api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
